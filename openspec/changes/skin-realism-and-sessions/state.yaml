open_questions:
  - >-
    Is a default ink depth of 0.55 too aggressive for colour work? Black work
    reads correctly at that value; saturated colour may need a lower default.
  - >-
    White and very pale ink are invisible under a multiply blend. Physically
    correct, but it may need an explicit note in the UI rather than a silent
    surprise.
